<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P-01 サインアップ — Hollow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --color-accent: oklch(37.1% 0 0); --color-accent-hover: oklch(43.9% 0 0); --color-accent-pressed: oklch(26.9% 0 0);
    --color-accent-surface: oklch(97% 0 0); --color-accent-ink: oklch(26.9% 0 0);
    --color-bg: #ffffff; --color-surface: #f5f5f7; --color-surface-hover: #ececef; --color-surface-elevated: #fbfbfd;
    --color-ink: #1d1d1f; --color-ink-secondary: #6e6e73; --color-ink-tertiary: #86868b;
    --color-hairline: rgba(60,60,67,0.12); --color-hairline-strong: rgba(60,60,67,0.18);
    --color-success: #1f8f3a; --color-success-surface: #e6f4ea; --color-warning: #a8580b; --color-warning-surface: #fdf3e7;
    --color-error: #c43e3e; --color-error-surface: #fbebeb; --color-error-hover: #b03535; --color-error-pressed: #9a2e2e;
    --color-info: var(--color-accent);
    --color-status-private: #86868b; --color-status-link: #a8580b; --color-status-public: #1f8f3a;
    --color-convert-working: var(--color-accent); --color-convert-awaiting: var(--color-warning);
    --color-convert-failed: var(--color-error); --color-convert-done: var(--color-success);
    --code-keyword: #aa3e3e; --code-string: #2a8c4f; --code-comment: var(--color-ink-tertiary);
    --code-function: #5b3da1; --code-number: #1d6fd6;
    --font-sans: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    --font-heading: var(--font-sans); --font-body: var(--font-sans);
    --text-xs: clamp(11px, 0.7vw + 9px, 12px); --text-sm: clamp(12px, 0.8vw + 10px, 13px);
    --text-base: clamp(14px, 1vw + 11px, 16px); --text-md: clamp(15px, 1vw + 12px, 17px);
    --text-lg: clamp(17px, 1.2vw + 13px, 19px); --text-xl: clamp(20px, 1.4vw + 14px, 24px);
    --text-2xl: clamp(24px, 2vw + 16px, 30px); --text-3xl: clamp(24px, 4vw, 38px);
    --text-mono: clamp(12.5px, 0.6vw + 11px, 13.5px);
    --weight-light: 300; --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600;
    --leading-tight: 1.2; --leading-snug: 1.35; --leading-normal: 1.5; --leading-relaxed: 1.75;
    --tracking-tightest: -0.022em; --tracking-tighter: -0.014em; --tracking-tight: -0.008em; --tracking-normal: -0.003em;
    --space-0: 0; --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
    --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px; --space-20: 80px;
    --content-max: 680px; --list-max: 780px; --wide-max: 1100px; --palette-max: 620px;
    --container-padding: clamp(16px, 4vw, 32px); --bar-height: 56px; --actionbar-height: 56px;
    --radius-xs: 4px; --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
    --radius-pill: 980px; --radius-full: 9999px;
    --icon-2xs: 11px; --icon-xs: 13px; --icon-sm: 14px; --icon-md: 18px;
    --shadow-none: none; --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.08); --shadow-lg: 0 16px 48px rgba(0,0,0,0.1);
    --shadow-focus: 0 0 0 2px var(--color-accent);
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); --ease-decel: cubic-bezier(0, 0, 0.2, 1); --ease-accel: cubic-bezier(0.4, 0, 1, 1);
    --duration-fast: 120ms; --duration-base: 180ms; --duration-slow: 280ms;
    --transition-default: all var(--duration-base) var(--ease-standard);
    --transition-bg: background-color var(--duration-fast) var(--ease-standard);
    --transition-color: color var(--duration-fast) var(--ease-standard);
    --opacity-disabled: 0.55; --opacity-pending: 0.6;
    --bar-bg: rgba(255,255,255,0.82); --bar-blur: saturate(180%) blur(20px);
    --bp-sm: 640px; --bp-md: 768px; --bp-lg: 1024px; --bp-xl: 1280px; --bp-2xl: 1536px;
  }

  html, body {
    background: var(--color-bg); color: var(--color-ink); font-family: var(--font-body);
    font-size: var(--text-base); line-height: var(--leading-normal); letter-spacing: var(--tracking-normal);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  input { font-family: inherit; }
  :focus-visible { outline: none; box-shadow: var(--shadow-focus); border-radius: inherit; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

  /* 認証は公開シェル: マークだけの静かなヘッダー */
  .auth-bar { height: var(--bar-height); display: flex; align-items: center; justify-content: center; }
  .mark { color: var(--color-ink); }

  .auth { max-width: 400px; margin: 0 auto; padding: var(--space-8) var(--space-4) var(--space-16); }
  .auth-title { font-size: var(--text-2xl); font-weight: var(--weight-regular); letter-spacing: var(--tracking-tightest); line-height: var(--leading-snug); text-align: center; }
  .auth-sub { font-size: var(--text-sm); color: var(--color-ink-secondary); text-align: center; margin-top: var(--space-3); margin-bottom: var(--space-8); }

  .field { margin-bottom: var(--space-4); }
  .field-label { display: block; font-size: var(--text-sm); font-weight: var(--weight-medium); margin-bottom: var(--space-2); }
  .field-hint { font-size: var(--text-xs); color: var(--color-ink-tertiary); margin-top: var(--space-2); }
  .field-error { font-size: var(--text-xs); color: var(--color-error); margin-top: var(--space-2); }
  .input {
    width: 100%; height: 44px; border: 1px solid var(--color-hairline-strong);
    border-radius: var(--radius-md); padding: 0 var(--space-3);
    font-size: var(--text-base); color: var(--color-ink); background: var(--color-bg);
    transition: border-color var(--duration-fast) var(--ease-standard);
  }
  .input::placeholder { color: var(--color-ink-tertiary); }
  .input:hover { border-color: var(--color-ink-tertiary); }
  .input:focus { outline: none; box-shadow: var(--shadow-focus); border-color: transparent; }
  .input.invalid { border-color: var(--color-error); }

  .strength { display: flex; gap: 3px; margin-top: var(--space-2); }
  .strength i { flex: 1; height: 3px; border-radius: 2px; background: var(--color-hairline); }
  .strength i.on { background: var(--color-warning); }
  .strength.good i.on { background: var(--color-success); }
  .strength-label { font-size: var(--text-xs); color: var(--color-ink-secondary); margin-top: var(--space-1); }

  .checkbox-row { display: flex; align-items: flex-start; gap: var(--space-3); cursor: pointer; margin: var(--space-5) 0; }
  .checkbox-row input[type="checkbox"] { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--color-accent); flex-shrink: 0; cursor: pointer; }
  .checkbox-label { font-size: var(--text-sm); color: var(--color-ink-secondary); }
  .checkbox-label a { color: var(--color-accent); text-decoration: underline; text-underline-offset: 3px; }

  .btn {
    width: 100%; height: 44px; border-radius: var(--radius-pill);
    font-size: var(--text-sm); font-weight: var(--weight-medium);
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    background: var(--color-accent); color: var(--color-bg); transition: var(--transition-bg);
  }
  .btn:hover { background: var(--color-accent-hover); }
  .btn:active { background: var(--color-accent-pressed); }
  .btn:disabled { opacity: var(--opacity-disabled); cursor: not-allowed; }
  .btn:disabled:hover { background: var(--color-accent); }
  .btn.outline { background: var(--color-bg); color: var(--color-ink); border: 1px solid var(--color-hairline-strong); }
  .btn.outline:hover { background: var(--color-surface); }

  .divider { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-6) 0; color: var(--color-ink-tertiary); font-size: var(--text-xs); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--color-hairline); }

  .foot { text-align: center; font-size: var(--text-sm); color: var(--color-ink-secondary); margin-top: var(--space-8); }
  .foot a { color: var(--color-accent); }
  .foot a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .alert {
    display: flex; gap: var(--space-3); align-items: flex-start;
    padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
    border: 1px solid color-mix(in oklab, var(--alert-accent, var(--color-accent)) 30%, transparent);
    box-shadow: var(--shadow-xs); margin-bottom: var(--space-6); text-align: left;
  }
  .alert-info { --alert-accent: var(--color-info); }
  .alert-error { --alert-accent: var(--color-error); }
  .alert > svg { color: var(--alert-accent); flex-shrink: 0; margin-top: 2px; }
  .alert-title { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--alert-accent); margin-bottom: 2px; }
  .alert-body { font-size: var(--text-sm); color: var(--color-ink-secondary); }
  .scope-badge { width: 18px; height: 18px; border-radius: var(--radius-sm); background: var(--color-ink); color: var(--color-bg); font-size: 9px; font-weight: var(--weight-medium); display: inline-flex; align-items: center; justify-content: center; vertical-align: -3px; margin-right: 4px; }

  @media (min-width: 640px) {
    .auth { padding: var(--space-12) var(--space-6) var(--space-16); }
  }
  @media (min-width: 1024px) { .auth { padding: var(--space-16) var(--space-6) var(--space-16); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header class="auth-bar">
  <a href="#" aria-label="Hollow のトップへ">
    <svg class="mark" width="30" height="18" viewBox="0 0 26 16" fill="none" stroke="currentColor" stroke-width="1.4" role="img" aria-label="Hollow"><circle cx="9" cy="8" r="6.4"/><circle cx="17" cy="8" r="6.4"/></svg>
  </a>
</header>

<main class="auth">
  <h1 class="auth-title">アカウントを作る</h1>
  <p class="auth-sub">ファイルを HTML に変換して保存し、公開範囲を選んで共有できます。</p>

  <!-- 招待経由で来た場合 -->
  <div class="alert alert-info" role="status">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22 6 12 13 2 6"/></svg>
    <div>
      <div class="alert-title"><span class="scope-badge" aria-hidden="true">DT</span>デザインチームに招待されています</div>
      <div class="alert-body">このメールアドレスのまま登録すると、確認メールを待たずに参加できます。</div>
    </div>
  </div>

  <form>
    <div class="field">
      <label class="field-label" for="email">メールアドレス</label>
      <input class="input" id="email" type="email" value="nakamura@example.com" autocomplete="email">
    </div>

    <div class="field">
      <label class="field-label" for="password">パスワード</label>
      <input class="input invalid" id="password" type="password" autocomplete="new-password" value="········" aria-describedby="pwErr">
      <div class="strength" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i></div>
      <p class="field-error" id="pwErr">パスワードが短すぎます。12 文字以上で入力してください</p>
    </div>

    <label class="checkbox-row">
      <input type="checkbox">
      <span class="checkbox-label"><a href="#">利用規約</a>と<a href="#">プライバシーポリシー</a>に同意します</span>
    </label>

    <button class="btn" type="submit" disabled>アカウントを作る</button>
  </form>

  <div class="divider">または</div>

  <button class="btn outline">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    Google で続ける
  </button>

  <p class="foot">アカウントをお持ちですか？ <a href="#">サインイン</a></p>
</main>

</body>
</html>
